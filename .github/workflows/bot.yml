name: Bot de promocoes de cafe

on:
  schedule:
    - cron: "7-59/10 * * * *"   # a cada ~10 minutos (minutos 7, 17, 27...)
  workflow_dispatch:            # botão para rodar na mão

permissions:
  contents: write

concurrency:
  group: bot-cafe
  cancel-in-progress: false

jobs:
  rodar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python bot.py
        env:
          WHATSAPP_PHONE: ${{ secrets.WHATSAPP_PHONE }}
          CALLMEBOT_APIKEY: ${{ secrets.CALLMEBOT_APIKEY }}
          GREENAPI_URL: ${{ secrets.GREENAPI_URL }}
          GREENAPI_ID: ${{ secrets.GREENAPI_ID }}
          GREENAPI_TOKEN: ${{ secrets.GREENAPI_TOKEN }}
      - name: Salvar estado
        run: |
          git config user.name "bot-cafe"
          git config user.email "bot-cafe@users.noreply.github.com"
          git add estado.json
          git diff --cached --quiet || git commit -m "atualiza estado"
          git pull --rebase
          git push
